name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and smoke
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.421

      - name: Check required README sections
        shell: pwsh
        run: |
          $readme = Get-Content README.md -Raw -Encoding UTF8
          $required = @(
            '## 1분 요약',
            '## 설치',
            '## 실행',
            '## 샘플 데이터',
            '## Build Command',
            '## Smoke Command',
            '## CI',
            '## Release Notes',
            '## Roadmap',
            '## Known Limitations'
          )
          foreach ($section in $required) {
            if (-not $readme.Contains($section)) {
              throw "README is missing required section: $section"
            }
          }
          if (-not (Test-Path RELEASE_NOTES.md)) {
            throw "RELEASE_NOTES.md is missing"
          }

      - name: Resolve product version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.VersionPrefix
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid product version: $version"
          }
          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build application
        shell: pwsh
        run: dotnet build .\OpenVisionLab.LabelingStudio.csproj -c Release -p:Platform=x64 -m:1 -nr:false /p:UseSharedCompilation=false

      - name: Publish versioned self-contained release
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-win-x64.ps1 -Configuration Release

      - name: Upload versioned win-x64 release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: openvisionlab-labeling-studio-${{ env.PRODUCT_VERSION }}-win-x64
          path: artifacts/publish/Release/win-x64/${{ env.PRODUCT_VERSION }}
          if-no-files-found: error
          retention-days: 1

      - name: Whitespace check
        shell: pwsh
        run: git diff --check
